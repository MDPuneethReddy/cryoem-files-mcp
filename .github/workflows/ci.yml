name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,dm4]'
      - run: pytest -q
      - run: python scripts/check_versions.py

  # Release path (tags only): gate -> build -> PyPI -> MCP Registry. Nothing is published unless every
  # earlier job passed. A PyPI version can never be uploaded twice, so the gate runs first.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must equal v<package version>, and all versions and CHANGELOG must match
        run: python scripts/check_versions.py "$GITHUB_REF_NAME"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cryoem-files-mcp
    permissions:
      id-token: write   # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcp-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry, no secrets needed
      contents: read
    env:
      # Pinned on purpose (registry docs: do not use the mutable releases/latest URL). Upgrade deliberately.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Wait until PyPI serves the new version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://pypi.org/pypi/cryoem-files-mcp/${version}/json"
          for i in $(seq 1 40); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then echo "PyPI serves ${version}"; exit 0; fi
            echo "attempt $i: HTTP $code, waiting 15 s"
            sleep 15
          done
          echo "PyPI did not serve ${version} within 10 minutes" >&2
          exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
